name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suites (pinned cores)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tests/telegram
    env:
      CORES_DIR: ${{ github.workspace }}/cores
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: tests/telegram/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Fetch pinned cores and verify checksums
        run: bash fetch-cores.sh "$CORES_DIR" pinned
      - name: UI
        run: node ui.mjs
      - name: Media regression
        run: node media-regression.mjs
      - name: Android boundary
        run: node android-boundary.mjs
      - name: CTR unit
        run: node ctr-unit.mjs
      - name: Worker DNS
        run: node worker-dns.mjs
      - name: Worker connect and fallback
        run: node worker-connect.mjs
      - name: Core validation
        run: node core-validate.mjs
      - name: Core end-to-end
        run: node core-e2e.mjs
      - name: Telegram end-to-end (Worker)
        run: bash run-e2e.sh worker
      - name: Telegram end-to-end (Pages)
        run: bash run-e2e.sh pages

  latest-cores:
    name: Core validation (latest stable cores)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/telegram
    env:
      CORES_DIR: ${{ github.workspace }}/cores-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: tests/telegram/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Fetch the latest stable cores
        run: bash fetch-cores.sh "$CORES_DIR" latest
      - name: Core validation
        run: node core-validate.mjs
      - name: Core end-to-end
        run: node core-e2e.mjs
