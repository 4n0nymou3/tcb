name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        working-directory: tests/telegram
        run: npm install --no-audit --no-fund
      - name: Download the latest stable cores
        run: |
          mkdir -p cores
          cd cores
          xray_tag=$(curl -sI https://github.com/XTLS/Xray-core/releases/latest | grep -i '^location' | sed 's|.*/tag/||' | tr -d '\r')
          sb_tag=$(curl -sI https://github.com/SagerNet/sing-box/releases/latest | grep -i '^location' | sed 's|.*/tag/||' | tr -d '\r')
          mh_tag=$(curl -sI https://github.com/MetaCubeX/mihomo/releases/latest | grep -i '^location' | sed 's|.*/tag/||' | tr -d '\r')
          curl -sL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${xray_tag}/Xray-linux-64.zip"
          curl -sL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/${sb_tag}/sing-box-${sb_tag#v}-linux-amd64.tar.gz"
          curl -sL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${mh_tag}/mihomo-linux-amd64-${mh_tag}.gz"
          unzip -q xray.zip -d xray
          tar xzf sb.tgz
          mv sing-box-*/sing-box ./sing-box
          gunzip -c mihomo.gz > mihomo
          chmod +x xray/xray sing-box mihomo
          curl -sL -o geoip.dat https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geoip.dat
          curl -sL -o geosite.dat https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geosite.dat
          echo "$xray_tag $sb_tag $mh_tag"
      - name: Panel tests
        working-directory: tests/telegram
        run: |
          node ui.mjs
          node media-regression.mjs
          node android-boundary.mjs
          node ctr-unit.mjs
          node worker-dns.mjs
      - name: Generated configs against the real cores
        working-directory: tests/telegram
        env:
          CORES_DIR: ${{ github.workspace }}/cores
        run: node core-validate.mjs
      - name: Real clients through a local Worker
        working-directory: tests/telegram
        env:
          CORES_DIR: ${{ github.workspace }}/cores
        run: node core-e2e.mjs
      - name: Telegram end-to-end
        working-directory: tests/telegram
        run: |
          bash run-e2e.sh worker
          bash run-e2e.sh pages
